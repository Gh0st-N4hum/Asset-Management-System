{% extends "base.html" %}
{% block content %}
<h1>{% if object %}Edit {{ object.asset_tag }}{% else %}New asset{% endif %}</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Save</button>
  <a href="{% if object %}{% url 'asset_detail' object.pk %}{% else %}{% url 'asset_list' %}{% endif %}">Cancel</a>
</form>
{% endblock %}
