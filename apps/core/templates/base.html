<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hospital Assets</title>
  <style>
    body{font-family:system-ui,sans-serif;margin:0;color:#222}
    header{background:#14532d;padding:.75rem 1.5rem;color:#fff}
    header a{color:#fff;text-decoration:none;margin-right:1rem}
    header .right{float:right}
    main{max-width:1100px;margin:auto;padding:1.5rem}
    table{border-collapse:collapse;width:100%}
    th,td{border-bottom:1px solid #ddd;padding:.5rem;text-align:left}
    .filters{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
    .msg{background:#dcfce7;padding:.5rem 1rem;border-radius:4px}
    .errorlist{color:#b91c1c}
  </style>
</head>
<body>
  <header>
    <a href="{% url 'asset_list' %}">Assets</a>
    {% if user.is_staff %}<a href="{% url 'admin:index' %}">Admin</a>{% endif %}
    {% if user.is_authenticated %}
    <span class="right">{{ user.username }}
      <form method="post" action="{% url 'logout' %}" style="display:inline">
        {% csrf_token %}<button type="submit">Log out</button>
      </form>
    </span>
    {% endif %}
  </header>
  <main>
    {% for m in messages %}<p class="msg">{{ m }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
